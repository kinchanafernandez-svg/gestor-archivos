syntax = "proto3";

package auditor;

service AuditorService {
  rpc LogEvent(LogEventRequest) returns (LogEventResponse);
  rpc GetLogs(GetLogsRequest) returns (GetLogsResponse);
  rpc GetUserLogs(GetUserLogsRequest) returns (GetUserLogsResponse);
  rpc ReplicateLog(ReplicateLogRequest) returns (ReplicateLogResponse);
}

message LogEventRequest {
  string user_id = 1;
  string action = 2;
  string resource = 3;
  string resource_id = 4;
  string status = 5;
  string details = 6;
  string ip_address = 7;
}

message LogEventResponse {
  string log_id = 1;
  bool success = 2;
}

message GetLogsRequest {
  int32 page = 1;
  int32 limit = 2;
  string action = 3;
  string status = 4;
}

message GetLogsResponse {
  repeated AuditLog logs = 1;
  int32 total = 2;
}

message GetUserLogsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetUserLogsResponse {
  repeated AuditLog logs = 1;
  int32 total = 2;
}

message AuditLog {
  string log_id = 1;
  string user_id = 2;
  string action = 3;
  string resource = 4;
  string resource_id = 5;
  string status = 6;
  string details = 7;
  string ip_address = 8;
  string timestamp = 9;
}

message ReplicateLogRequest {
  AuditLog log = 1;
  string target_node = 2;
}

message ReplicateLogResponse {
  bool success = 1;
  string message = 2;
}
