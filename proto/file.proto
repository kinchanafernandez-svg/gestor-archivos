syntax = "proto3";

package file;

service FileService {
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse);
  rpc DownloadFile(DownloadFileRequest) returns (DownloadFileResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc GetFileMetadata(GetFileMetadataRequest) returns (GetFileMetadataResponse);
  rpc ReplicateFile(ReplicateFileRequest) returns (ReplicateFileResponse);
}

message UploadFileRequest {
  string filename = 1;
  bytes content = 2;
  string user_id = 3;
  string mime_type = 4;
}

message UploadFileResponse {
  string file_id = 1;
  string message = 2;
  bool success = 3;
  repeated string replica_nodes = 4;
}

message DownloadFileRequest {
  string file_id = 1;
  string user_id = 2;
}

message DownloadFileResponse {
  string filename = 1;
  bytes content = 2;
  string mime_type = 3;
  bool success = 4;
}

message DeleteFileRequest {
  string file_id = 1;
  string user_id = 2;
}

message DeleteFileResponse {
  bool success = 1;
  string message = 2;
}

message ListFilesRequest {
  string user_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message ListFilesResponse {
  repeated FileMetadata files = 1;
  int32 total = 2;
}

message GetFileMetadataRequest {
  string file_id = 1;
}

message GetFileMetadataResponse {
  FileMetadata metadata = 1;
  bool success = 2;
}

message FileMetadata {
  string file_id = 1;
  string filename = 2;
  string user_id = 3;
  int64 size = 4;
  string mime_type = 5;
  string created_at = 6;
  repeated string replica_nodes = 7;
}

message ReplicateFileRequest {
  string file_id = 1;
  string target_node = 2;
  bytes content = 3;
  FileMetadata metadata = 4;
}

message ReplicateFileResponse {
  bool success = 1;
  string message = 2;
}
